<head>

<title>בינינו — משחק זוגי</title>
<style>
:root{--bg:#0b0d12;--panel:#151922;--text:#f8fafc;--muted:#aab1bd;--border:#2a3140;--accent:#6d8cff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px} .small{font-size:14px;color:var(--muted)} .stage{font-weight:700}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:14px;min-height:48px;padding:10px 14px} button:active{transform:scale(.985)} button:disabled{opacity:.4}
.progress{height:8px;background:var(--panel);border-radius:999px;overflow:hidden;margin:14px 0 18px} #bar{height:100%;transition:.25s}
.card{min-height:380px;border:2px solid;border-radius:28px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;transition:.25s}
.cardhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:28px} .pill{font-size:14px;font-weight:800;padding:8px 12px;border-radius:999px} .turn{font-size:14px;color:var(--muted)} .q{font-size:clamp(26px,7vw,38px);line-height:1.45;font-weight:750;margin:0} .hint{font-size:15px;line-height:1.55;color:var(--muted);margin-top:28px}
.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px} #next{background:#25314e;border-color:#3b4f7d;font-weight:800}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px} .toggle{display:flex;gap:9px;align-items:center;min-height:44px;cursor:pointer} input{width:20px;height:20px;flex-shrink:0;accent-color:var(--accent)}
.categories{min-width:0;margin:18px 0 0;padding:12px 14px;border:1px solid var(--border);border-radius:16px;background:var(--panel)} .categories legend{padding:0 6px;font-weight:700} .category-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px} .category-help{margin:0 0 8px;line-height:1.5} .category-status{margin:8px 0 0;color:#fbbf24;line-height:1.5} .category-status:empty{display:none} .toggle:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.install{display:none;margin:0 0 16px;padding:12px 14px;border:1px solid var(--border);border-radius:16px;background:var(--panel);font-size:14px;color:var(--muted);line-height:1.5}
@media(max-width:390px){.card{min-height:360px;padding:20px}.actions button{padding:8px 6px;font-size:15px}}
@media(max-width:360px){.category-options{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<div id="installNote" class="install">לאחר ההתקנה למסך הבית, המשחק יעבוד גם בלי חיבור לאינטרנט.</div>
<div class="top"><div><div id="stage" class="stage"></div><div id="progressText" class="small"></div></div><button id="reset">התחלה מחדש</button></div>
<div class="progress"><div id="bar"></div></div>
<section id="card" class="card"><div><div class="cardhead"><span id="category" class="pill"></span><span id="turn" class="turn"></span></div><p id="question" class="q"></p></div><p id="hint" class="hint"></p></section>
<div class="actions"><button id="prev">הקודם</button><button id="skip">דלגו</button><button id="next">הבא ←</button></div>
<fieldset class="categories" aria-describedby="categoryHelp categoryStatus"><legend>אילו קטגוריות לשלב במשחק?</legend><p id="categoryHelp" class="small category-help">בחרו לפחות קטגוריה אחת. שינוי הבחירה מתחיל מהקלף הראשון.</p><button id="selectAll" type="button" style="margin-bottom:8px">בחר הכל</button><div id="categoryOptions" class="category-options"></div><p id="categoryStatus" class="small category-status" role="status" aria-live="polite"></p></fieldset>
<div class="bottom"><button id="shuffle">ערבבו את הקלפים</button></div>
</main>
<script>
const META={"להכיר מחדש":{"level":1,"color":"#3b82f6","text":"#fff","icon":"💬","stage":"מכירים מחדש","turn":"אחד בכל פעם","hint":"אל תסתפקו בתשובה קצרה — ספרו את הסיפור שמאחוריה."},"זיכרונות":{"level":2,"color":"#d4a017","text":"#171717","icon":"📸","stage":"נזכרים ביחד","turn":"שניכם עונים","hint":"ספרו כל אחד את הגרסה שלו, גם אם אתם זוכרים אחרת."},"כמה מכירים?":{"level":3,"color":"#8b5cf6","text":"#fff","icon":"🎯","stage":"כמה אתם מכירים?","turn":"נחשו לפני שעונים","hint":"בן או בת הזוג מנחשים קודם — ורק אז מגלים את התשובה."},"אנחנו":{"level":4,"color":"#ec4899","text":"#fff","icon":"💕","stage":"הזוגיות שלנו","turn":"שניכם עונים","hint":"נסו להיות ספציפיים ולתת דוגמה מהחיים שלכם."},"אתגר זוגי":{"level":5,"color":"#22a447","text":"#fff","icon":"🎲","stage":"זמן למשימה","turn":"עשו עכשיו","hint":"לא לחשוב יותר מדי — פשוט עשו את המשימה."},"עמוק יותר":{"level":6,"color":"#ea7c18","text":"#fff","icon":"🧡","stage":"נכנסים לעומק","turn":"אחד בכל פעם","hint":"המטרה היא להבין, לא לתקן. תנו לשני לסיים לפני שמגיבים."},"קרובים יותר":{"level":7,"color":"#e54848","text":"#fff","icon":"❤️","stage":"מתקרבים","turn":"שניכם עונים","hint":"ענו רק עד לרמה שנוחה לשניכם."},"אחרי החשיכה":{"level":8,"color":"#a91f2b","text":"#fff","icon":"🔥","stage":"אחרי החשיכה","turn":"שניכם עונים","hint":"מותר לדלג על כל קלף. כל דבר נעשה רק אם שניכם רוצים."},"תשוקה":{"level":9,"color":"#c026d3","text":"#fff","icon":"💋","stage":"מדברים על תשוקה","turn":"שניכם משתפים ובוחרים","hint":"דברו בכנות, בלי לנחש בשביל השני. כל משימה היא בחירה משותפת, ותמיד אפשר לדלג."}};
const ORIGINAL=[{"cat":"להכיר מחדש","q":"איזה אירוע מהילדות שלך השפיע על מי שאתה היום יותר ממה שאנשים סביבך יודעים?"},{"cat":"להכיר מחדש","q":"מה משהו שפעם היה חלק משמעותי מאוד ממך והיום כמעט אף אחד בחיים שלך לא מכיר?"},{"cat":"להכיר מחדש","q":"איזו מחמאה שקיבלת לפני שנים אתה עדיין זוכר, ולמה דווקא היא נשארה איתך?"},{"cat":"להכיר מחדש","q":"איזה זיכרון ילדות נראה חסר חשיבות לאחרים, אבל בשבילך הוא משמעותי במיוחד?"},{"cat":"להכיר מחדש","q":"לאיזו גרסה קודמת של עצמך אתה הכי מתגעגע, ומה היה שונה בך אז?"},{"cat":"להכיר מחדש","q":"מה משהו שעשית בחיים שאתה גאה בו, אבל כמעט אף פעם לא מספר עליו?"},{"cat":"להכיר מחדש","q":"מה היה הדבר הראשון שגרם לך להרגיש שאתה באמת טוב במשהו?"},{"cat":"להכיר מחדש","q":"מי השפיע על האישיות שלך בצורה משמעותית בלי שהוא בהכרח יודע את זה?"},{"cat":"להכיר מחדש","q":"איזה חלום שהיה לך פעם ויתרת עליו בדרך, והאם חלק ממך עדיין רוצה אותו?"},{"cat":"להכיר מחדש","q":"איזו תקופה בחיים שלך היית רוצה שאוכל לראות ליום אחד כדי להבין אותך טוב יותר?"},{"cat":"להכיר מחדש","q":"איזה דבר קטן מהבית שבו גדלת עדיין נמצא בהתנהגות שלך היום?"},{"cat":"להכיר מחדש","q":"איזה רגע בחיים שינה את הדעה שלך על עצמך?"},{"cat":"להכיר מחדש","q":"מה משהו שפחדת ממנו מאוד בעבר והיום כבר כמעט לא מפחיד אותך?"},{"cat":"להכיר מחדש","q":"איזה חלק באישיות שלך לקח לך הכי הרבה זמן לקבל?"},{"cat":"להכיר מחדש","q":"אם הייתי פוגש אותך בגיל 15, מה היה הכי מפתיע אותי בך?"},{"cat":"להכיר מחדש","q":"איזו החלטה קטנה שקיבלת בעבר שינתה בדיעבד חלק גדול מהחיים שלך?"},{"cat":"להכיר מחדש","q":"איזה צד שלך יוצא רק ליד אנשים שאתה מרגיש איתם בטוח לגמרי?"},{"cat":"להכיר מחדש","q":"מה הדבר שאתה הכי רוצה שאנשים הקרובים אליך יבינו עליך בלי שתצטרך להסביר אותו?"},{"cat":"להכיר מחדש","q":"איזה אדם מהעבר שלך היית רוצה לפגוש לשיחה אחת נוספת, ומה היית רוצה לומר לו?"},{"cat":"להכיר מחדש","q":"מה הדבר הכי ספונטני שעשית ושאף פעם לא היית מצפה מעצמך לעשות?"},{"cat":"להכיר מחדש","q":"איזה כישלון או טעות לימדו אותך משהו שאתה עדיין משתמש בו היום?"},{"cat":"להכיר מחדש","q":"איזה מנהג, אמונה או כלל גדלת עליו ורק בבגרות התחלת לשאול עליו שאלות?"},{"cat":"להכיר מחדש","q":"מה משהו שאתה אוהב בעצמך היום, אבל בעבר ניסית להסתיר או לשנות?"},{"cat":"להכיר מחדש","q":"איזה סיפור על עצמך אתה חושב שמעולם לא יצא לך לספר לי עד הסוף?"},{"cat":"זיכרונות","q":"מה הזיכרון הראשון שלנו שאתה יכול ממש לראות בראש כאילו הוא קרה אתמול?"},{"cat":"זיכרונות","q":"איזה רגע שלנו גרם לך לחשוב: יש פה משהו מיוחד?"},{"cat":"זיכרונות","q":"איזו חופשה, יציאה או הרפתקה שלנו היית עושה שוב בדיוק אותו דבר?"},{"cat":"זיכרונות","q":"מה לדעתך היה הרושם הראשוני שלי ממך?"},{"cat":"זיכרונות","q":"מה הדבר הכי מצחיק שקרה לנו ועדיין מצליח להצחיק אותך?"},{"cat":"זיכרונות","q":"איזה רגע זוגי קטן שלנו היית רוצה שנזכור גם בעוד 30 שנה?"},{"cat":"זיכרונות","q":"איזה יום רגיל שלנו הפך בדיעבד לזיכרון שאתה ממש אוהב?"},{"cat":"זיכרונות","q":"מה היה הדייט או הערב הכי מפתיע שהיה לנו?"},{"cat":"זיכרונות","q":"איזה קושי שעברנו יחד גרם לך להרגיש שאנחנו צוות?"},{"cat":"זיכרונות","q":"איזה רגע שלנו היית רוצה לראות שוב מהצד כמו בסרט?"},{"cat":"זיכרונות","q":"איזה שיר, מקום או ריח מיד מחזיר אותך לרגע משותף שלנו?"},{"cat":"זיכרונות","q":"מה הדבר הכי קטן שעשיתי פעם ושעדיין זכור לך לטובה?"},{"cat":"כמה מכירים?","q":"אם הייתי מקבל יום שלם בלי שום מחויבות, איך לדעתך הייתי מעביר אותו?"},{"cat":"כמה מכירים?","q":"איזה מאכל הייתי בוחר אם הייתי חייב לאכול רק ארוחה אחת במשך שבוע?"},{"cat":"כמה מכירים?","q":"מה הדבר שהכי מהר מצליח להוציא אותי ממצב רוח רע?"},{"cat":"כמה מכירים?","q":"אם הייתי יכול לקבל כישרון חדש באופן מיידי, במה הייתי בוחר?"},{"cat":"כמה מכירים?","q":"איזה הרגל שלי אני הכי פחות מודע אליו?"},{"cat":"כמה מכירים?","q":"מה לדעתך הדבר שאני הכי מעריך בך?"},{"cat":"כמה מכירים?","q":"אם הייתי צריך לבחור עבודה אחרת לגמרי ממה שאני עושה היום, במה הייתי בוחר?"},{"cat":"כמה מכירים?","q":"מה לדעתך הדבר שהכי מלחיץ אותי לפני החלטה גדולה?"},{"cat":"כמה מכירים?","q":"איזה סוג חופשה הייתי בוחר בלי להתלבט: עיר, טבע, ים או הרפתקה?"},{"cat":"כמה מכירים?","q":"מה לדעתך הייתי עושה קודם אם הייתי זוכה פתאום בסכום כסף גדול?"},{"cat":"כמה מכירים?","q":"איזה דבר קטן כמעט תמיד מצליח לשמח אותי?"},{"cat":"כמה מכירים?","q":"באיזה נושא לדעתך הכי קל לי לדבר שעות בלי לשים לב לזמן?"},{"cat":"אנחנו","q":"מה אנחנו עושים טוב יותר כזוג היום מאשר בתחילת הקשר?"},{"cat":"אנחנו","q":"איזה הרגל זוגי קטן היית רוצה שנאמץ?"},{"cat":"אנחנו","q":"מתי לאחרונה הרגשת שבן או בת הזוג ממש רואים ומבינים אותך?"},{"cat":"אנחנו","q":"מה הדבר שאתה הכי אוהב בדרך שבה אנחנו מבלים זמן ביחד?"},{"cat":"אנחנו","q":"אם היינו יכולים להוסיף מסורת אחת רק שלנו — מה היא הייתה?"},{"cat":"אנחנו","q":"איזה צד שלך הקשר שלנו הוציא ממך שלא הכרת קודם?"},{"cat":"אנחנו","q":"מה הדבר הכי טוב בכך שאנחנו שונים זה מזה?"},{"cat":"אנחנו","q":"באיזה מצב אנחנו מתפקדים הכי טוב כצוות?"},{"cat":"אנחנו","q":"מה אתה חושב שאנחנו עושים שעוזר לקשר שלנו להחזיק גם בתקופות עמוסות?"},{"cat":"אנחנו","q":"איזה חלום משותף היית רוצה שנהפוך למשהו ממשי בשנים הקרובות?"},{"cat":"אנחנו","q":"מה היית רוצה שיהיה לנו יותר ממנו בשגרה: שיחות, יציאות, מגע, צחוק, שקט או משהו אחר?"},{"cat":"אנחנו","q":"איזה דבר קטן שאני עושה גורם לך להרגיש אהוב או מוערך?"},{"cat":"אנחנו","q":"מה אתה חושב שלמדת על אהבה מאז שאנחנו יחד?"},{"cat":"אנחנו","q":"איזה נושא זוגי לדעתך אנחנו טובים בלדבר עליו, ואיזה נושא אנחנו נוטים לדחות?"},{"cat":"אנחנו","q":"אם היינו מתארים את הזוגיות שלנו בשלוש מילים, אילו מילים היית בוחר?"},{"cat":"אנחנו","q":"מה היית רוצה שנבטיח לעצמנו לא להפסיק לעשות גם בעוד הרבה שנים?"},{"cat":"אתגר זוגי","q":"בלי לדבר במשך 20 שניות: הסתכלו אחד על השני. הראשון שצוחק מפסיד."},{"cat":"אתגר זוגי","q":"כל אחד אומר שלושה דברים על עצמו: שניים נכונים ואחד מומצא. השני צריך לזהות את השקר."},{"cat":"אתגר זוגי","q":"בחרו שיר שמזכיר לכם אחד את השני והסבירו למה."},{"cat":"אתגר זוגי","q":"יש לכם 30 שניות לתכנן דייט מושלם בתקציב כמעט אפסי."},{"cat":"אתגר זוגי","q":"תנו אחד לשני כינוי חדש שמתבסס על משהו שקרה לכם יחד."},{"cat":"אתגר זוגי","q":"כל אחד מחקה הרגל קטן של השני עד שהוא מזהה מה זה."},{"cat":"אתגר זוגי","q":"כל אחד נותן לשני מחמאה שאסור לה להיות קשורה למראה חיצוני."},{"cat":"אתגר זוגי","q":"ספרו יחד סיפור מהקשר שלכם, אבל כל אחד מוסיף משפט אח ר לדבר על הרעיון בלי לפרט את הפנטזיה."},{"cat":"תשוקה","q":"מה ההבדל אצלך בין להרגיש נחשק או נחשקת לבין להרגיש חשק?"},{"cat":"תשוקה","q":"איך היית רוצה שנדבר על העדפה מינית שיש רק לאחד מאיתנו, בלי להפוך את השיחה לשכנוע?"},{"cat":"תשוקה","q":"באיזה רגע הכי נוח לך לדבר על סקס: בזמן אינטימי, אחריו או ביום אחר לגמרי? למה?"},{"cat":"תשוקה","q":"מה עוזר לך להרגיש בנוח עם הגוף שלך באינטימיות, גם ביום שבו הביטחון העצמי נמוך?"},{"cat":"תשוקה","q":"איזה מסר על מיניות שספגת בעבר כבר לא מתאים לך היום?"},{"cat":"תשוקה","q":"איזו הנחה שלי על ההעדפות המיניות שלך היית רוצה שאבדוק איתך מחדש?"},{"cat":"תשוקה","q":"כמה מקום היית רוצה שיהיה לצחוק ולקלילות בחיי המין שלנו, במיוחד כשמשהו יוצא מביך?"},{"cat":"תשוקה","q":"כשאתה או את יוזמים אינטימיות, מה חשוב לך שאבין על המשמעות של היוזמה הזאת בשבילך?"},{"cat":"תשוקה","q":"איך אפשר לדבר על התדירות שהיית רוצה בחיי המין שלנו, בלי שתרגיש כמו יעד שצריך לעמוד בו?"},{"cat":"תשוקה","q":"מה היית רוצה שנעשה אחרי זמן אינטימי כדי להישאר קרובים גם כשהערב ממשיך?"},{"cat":"תשוקה","q":"משימה: הכינו כל אחד מפת חשק קצרה — דבר אחד שמפנה מקום לחשק, דבר שמקשה עליו ודבר שמשתנה לפי היום. השוו בלי לנסות לתקן."},{"cat":"תשוקה","q":"משימה: השלימו בתורכם את המשפט: ׳בחיי המין שלנו הייתי רוצה יותר מקום ל...׳. מי שמקשיב שואל שאלת הבהרה אחת לפני שמגיב."},{"cat":"תשוקה","q":"משימה: בחרו בנפרד מה מתאים לכם בדרך כלל בכל זוג מילים: ספונטניות או תכנון, שקט או שיחה, קצב איטי או משתנה. שתפו איפה התשובה תלויה במצב הרוח."},{"cat":"תשוקה","q":"משימה: המציאו סימן פרטי שאומר ׳יש לי רצון לזמן אינטימי איתך׳. בחרו גם תשובה חמה שמשמעותה ׳לא עכשיו׳."},{"cat":"תשוקה","q":"משימה: אמרו אחד לשני מחמאה ספציפית על משהו שמושך אתכם — הבעה, קול, סגנון או דרך התנהגות. ספרו מתי שמתם לב אליו לאחרונה."},{"cat":"תשוקה","q":"משימה: כל אחד בוחר מילה שמתארת משהו שמסקרן אותו בעולם המיניות — למשל חידוש, רוך, משחקיות או ביטחון. דברו על משמעות המילה עבורכם, בלי צורך לתאר מעשים."},{"cat":"תשוקה","q":"משימה: תרגלו בקשה אחת על הקצב או על התקשורת בזמן אינטימי, בניסוח ׳יהיה לי יותר נעים אם...׳. השני חוזר במילים שלו על מה שהבין."},{"cat":"תשוקה","q":"משימה: בחרו דבר אחד שתרצו ללמוד זה על זו בתחום המיניות. נסחו יחד שאלה שהייתם מרגישים בנוח לענות עליה בדייט הבא."}];
const CATEGORIES=Object.keys(META);
let deck=[...ORIGINAL], i=0, selectedCategories=[...CATEGORIES];
const $=s=>document.querySelector(s);
function filtered(){return deck.filter(x=>selectedCategories.includes(x.cat))}
function restoreState(){
 try{
  const s=JSON.parse(localStorage.getItem('beinenu_state')||'null');
  if(!s||typeof s!=='object')return;
  if(Array.isArray(s.selectedCategories)){
   selectedCategories=CATEGORIES.filter(cat=>s.selectedCategories.includes(cat));
   if(!selectedCategories.length)selectedCategories=[CATEGORIES[0]];
  }else{
   selectedCategories=CATEGORIES.filter(cat=>s.spicy!==false||META[cat].level<7);
  }
  // Keep the saved order and progress when new questions are added.
  if(Array.isArray(s.deck)&&s.deck.length>0&&s.deck.length<=ORIGINAL.length){
   const restored=s.deck.map(x=>ORIGINAL.find(q=>x&&q.cat===x.cat&&q.q===x.q));
   const seen=new Set(restored);
   if(restored.every(Boolean)&&seen.size===restored.length){
    const previousCount=restored.filter(x=>selectedCategories.includes(x.cat)).length;
    deck=[...restored,...ORIGINAL.filter(x=>!seen.has(x))];
    i=Number.isInteger(s.i)?Math.max(0,Math.min(s.i,previousCount-1)):0;
   }
  }
 }catch(e){}
}
function renderCategoryOptions(){
 for(const cat of CATEGORIES){
  const label=document.createElement('label'),input=document.createElement('input'),text=document.createElement('span');
  label.className='toggle';input.type='checkbox';input.value=cat;input.checked=selectedCategories.includes(cat);
  text.textContent=`${META[cat].icon} ${cat}`;
  input.addEventListener('change',()=>{
   if(!input.checked&&selectedCategories.length===1){
    input.checked=true;$('#categoryStatus').textContent='יש להשאיר לפחות קטגוריה אחת פעילה.';return;
   }
   selectedCategories=CATEGORIES.filter(name=>name===cat?input.checked:selectedCategories.includes(name));
   $('#categoryStatus').textContent='';i=0;render();
  });
  label.append(input,text);$('#categoryOptions').append(label);
 }
}
function render(){
 $('#selectAll').disabled=selectedCategories.length===CATEGORIES.length;
 const d=filtered(); if(!d.length)return; i=Math.max(0,Math.min(i,d.length-1));
 const x=d[i],m=META[x.cat],card=$('#card'),pill=$('#category');
 card.style.borderColor=m.color;card.style.background=`color-mix(in srgb,${m.color} 10%, #151922)`;
 pill.style.background=m.color;pill.style.color=m.text;pill.textContent=`${m.icon} ${x.cat}`;
 $('#bar').style.background=m.color;$('#bar').style.width=`${((i+1)/d.length)*100}%`;
 $('#stage').textContent=m.stage;$('#progressText').textContent=`קלף ${i+1} מתוך ${d.length}`;
 $('#turn').textContent=m.turn;$('#question').textContent=x.q;$('#hint').textContent=m.hint;
 $('#prev').disabled=i===0;$('#next').disabled=i===d.length-1;$('#next').textContent=i===d.length-1?'סיימנו ♥':'הבא ←';
 try{localStorage.setItem('beinenu_state',JSON.stringify({deck,i,selectedCategories}))}catch(e){}
}
$('#next').addEventListener('click',()=>{if(i<filtered().length-1){i++;render()}});
$('#prev').addEventListener('click',()=>{if(i>0){i--;render()}});
$('#skip').addEventListener('click',()=>{if(i<filtered().length-1){i++;render()}});
$('#reset').addEventListener('click',()=>{deck=[...ORIGINAL];i=0;render()});
$('#shuffle').addEventListener('click',()=>{for(let n=deck.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[deck[n],deck[j]]=[deck[j],deck[n]]}i=0;render()});
$('#selectAll').addEventListener('click',()=>{
 if(selectedCategories.length===CATEGORIES.length)return;
 selectedCategories=[...CATEGORIES];
 document.querySelectorAll('#categoryOptions input').forEach(input=>{input.checked=true});
 $('#categoryStatus').textContent='';i=0;render();
});
restoreState();
renderCategoryOptions();
if('serviceWorker' in navigator){
 let hadController=!!navigator.serviceWorker.controller,reloading=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{
  if(hadController&&!reloading){reloading=true;window.location.reload()}
  hadController=true;
 });
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(registration=>{
  document.addEventListener('visibilitychange',()=>{
   if(document.visibilityState==='visible')registration.update().catch(()=>{});
  });
 }).catch(()=>{});
}
if(window.matchMedia && !window.matchMedia('(display-mode: standalone)').matches) $('#installNote').style.display='block';
render();
</script>
